name: CI/CD Pipeline

# Triggers: push to main and PRs against main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Default environment values (non-secrets). Override these via repo Secrets if needed.
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '797240615708'
  ECR_REPOSITORY: ecommerce
  # IMAGE_TAG will use the short commit SHA by default
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ci:
    name: Checkout → Test → SonarQube → Checkov → Build → Trivy → Push to ECR → Update GitOps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python and Node (for multi-language projects)
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install jq and yq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          python -m pip install --upgrade pip
          pip install yq

      - name: Install dependencies & Run unit tests (auto-detect)
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            echo "Detected Node.js project"
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            if npm test --silent; then echo "Node tests passed"; else echo "Node tests failed"; exit 1; fi
          elif [ -f requirements.txt ] || [ -f setup.py ]; then
            echo "Detected Python project"
            python -m pip install -r requirements.txt || true
            if [ -f pytest.ini ] || [ -d tests ]; then python -m pytest -q; else echo "No pytest tests detected; skipping"; fi
          else
            echo "No known dependency manifest found (package.json or requirements.txt). Skipping install/tests.";
          fi

      - name: SonarQube scan (if configured via secrets)
        if: ${{ secrets.SONAR_HOST_URL && secrets.SONAR_TOKEN }}
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_LOGIN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ github.repository }}
        run: |
          echo "Running SonarScanner via Docker"
          docker run --rm \
            -e SONAR_HOST_URL=${SONAR_HOST_URL} \
            -e SONAR_LOGIN=${SONAR_LOGIN} \
            -v "$PWD":/usr/src \
            sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey=${SONAR_PROJECT_KEY} || true

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v14
        with:
          directory: .

      - name: Prepare image variables
        id: image_vars
        run: |
          echo "IMAGE_REPO=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "IMAGE_URI=${IMAGE_REPO}:${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
        # If not using OIDC/assume-role, provide access keys instead
        # with:
        #   aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        #   aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} || aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }}

      - name: Build and push Docker image to ECR
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache,mode=max

      - name: Trivy scan pushed image
        uses: aquasecurity/trivy-action@v2
        with:
          image-ref: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'

      - name: Update GitOps repository (values/manifest) with new image
        env:
          GITOPS_REPO: ${{ secrets.GITOPS_REPO }}
          GITOPS_BRANCH: ${{ secrets.GITOPS_BRANCH || 'main' }}
          GITOPS_PATH: ${{ secrets.GITOPS_PATH || '' }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE_REPO: ${{ env.IMAGE_REPO }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          if [ -z "${GITOPS_REPO}" ]; then
            echo "No GITOPS_REPO configured; skipping GitOps update"; exit 0
          fi

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Clone GitOps repo
          CLONE_URL=$(echo "${GITOPS_REPO}" | sed -e "s#https://#https://${GITOPS_TOKEN}@#")
          git clone --depth 1 --branch "${GITOPS_BRANCH}" "${CLONE_URL}" gitops

          TARGET_DIR="gitops/${GITOPS_PATH}"
          if [ ! -d "${TARGET_DIR}" ]; then
            echo "Target dir ${TARGET_DIR} not found; listing repo:"; ls -la gitops || true
            # proceed but do not fail to avoid blocking deploy pipelines
          fi

          # Example: if a Helm values.yaml exists, update image.repository and image.tag
          VALUES_FILE="${TARGET_DIR}/values.yaml"
          if [ -f "${VALUES_FILE}" ]; then
            echo "Updating ${VALUES_FILE} with ${IMAGE_REPO}:${IMAGE_TAG}"
            if command -v yq >/dev/null 2>&1; then
              yq eval ".image.repository = \"${IMAGE_REPO}\" | .image.tag = \"${IMAGE_TAG}\"" -i "${VALUES_FILE}"
            else
              sed -i "s|image: .*|image: ${IMAGE_REPO}:${IMAGE_TAG}|g" "${VALUES_FILE}" || true
            fi

            cd gitops
            git add "${GITOPS_PATH}/values.yaml"
            git commit -m "ci: update image to ${IMAGE_REPO}:${IMAGE_TAG} [skip ci]" || echo "No changes to commit"
            git push origin "${GITOPS_BRANCH}"
          else
            echo "No values.yaml at ${VALUES_FILE}; skipping modification"
          fi

      - name: Finish
        run: echo "CI job finished"

# Secrets required (set in repo settings):
# - AWS_REGION
# - AWS_ACCOUNT_ID
# - ECR_REPOSITORY
# - GITOPS_REPO (https clone URL)
# - GITOPS_TOKEN (personal access token with repo write for the GitOps repo)
# Optional:
# - AWS_ASSUME_ROLE (ARN) to assume for ECR push (recommended)
# - SONAR_HOST_URL and SONAR_TOKEN for SonarQube
# - Additional adaptation may be required for non-Helm GitOps repo structures
